<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12241F">
    <title>كاشير — تسجيل الدخول</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="app-shell">
        <main class="login-page">
            <div class="container">

                <!-- العلامة -->
                <div class="login-brand">
                    <div class="login-brand__mark" aria-hidden="true">ك</div>
                    <h1 class="login-brand__title">كاشير</h1>
                    <p class="login-brand__subtitle">نظام إدارة المطاعم — السودان</p>
                </div>

                <!-- بطاقة الدخول -->
                <div class="card login-card">
                    <!-- العنصر المميز: حافة مسننة تحاكي قصّ إيصال الطابعة -->
                    <div class="receipt-edge receipt-edge--top" aria-hidden="true"></div>

                    <div class="card__body login-card__printhead">

                        <!-- تبويب: دخول مطعم / دخول مدير المنصة -->
                        <div class="tabs" role="tablist" aria-label="نوع الدخول">
                            <button type="button" class="tabs__btn is-active" id="tab-restaurant" role="tab" aria-selected="true">
                                دخول مطعم
                            </button>
                            <button type="button" class="tabs__btn" id="tab-super-admin" role="tab" aria-selected="false">
                                مدير المنصة
                            </button>
                        </div>

                        <div id="alert-box" class="alert" role="alert"></div>

                        <form id="login-form" novalidate>
                            <div class="field" id="field-restaurant-slug">
                                <label class="field__label" for="restaurant-slug">معرّف المطعم</label>
                                <input
                                    class="field__input"
                                    type="text"
                                    id="restaurant-slug"
                                    name="restaurantSlug"
                                    placeholder="مثال: مطعم-الوادي"
                                    autocomplete="off"
                                    autocapitalize="off"
                                    spellcheck="false"
                                >
                            </div>

                            <div class="field">
                                <label class="field__label" for="username">اسم المستخدم</label>
                                <input
                                    class="field__input"
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="اسم المستخدم"
                                    autocomplete="username"
                                    autocapitalize="off"
                                    spellcheck="false"
                                    required
                                >
                            </div>

                            <div class="field">
                                <label class="field__label" for="password">كلمة المرور</label>
                                <input
                                    class="field__input"
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="••••••••"
                                    autocomplete="current-password"
                                    required
                                >
                            </div>

                            <button type="submit" class="btn btn--primary btn--lg" id="login-submit">
                                <span class="spinner" aria-hidden="true"></span>
                                <span class="btn__label">تسجيل الدخول</span>
                            </button>
                        </form>

                    </div>
                </div>

                <p class="login-footer-link">
                    أول مرة تشغّل النظام؟
                    <button type="button" id="open-setup">إعداد حساب مدير المنصة</button>
                </p>

            </div>
        </main>
    </div>

    <!-- ============================================================
         نافذة الإعداد الأول (Setup) — تظهر فقط عند الحاجة، ومخفية افتراضيًا
         ============================================================ -->
    <div class="app-shell" id="setup-overlay" style="display:none; position:fixed; inset:0; background:rgba(18,36,31,0.92); z-index:50; align-items:center; justify-content:center; padding: var(--space-4);">
        <div class="container">
            <div class="card">
                <div class="card__body">
                    <h2 style="font-size:20px; margin-bottom: var(--space-2);">إعداد أول حساب مدير</h2>
                    <p style="color:var(--color-text-muted); font-size:14px; margin-bottom: var(--space-5);">
                        يعمل هذا مرة واحدة فقط عند أول تشغيل للنظام.
                    </p>

                    <div id="setup-alert-box" class="alert" role="alert"></div>

                    <form id="setup-form" novalidate>
                        <div class="field">
                            <label class="field__label" for="setup-username">اسم المستخدم</label>
                            <input class="field__input" type="text" id="setup-username" required autocomplete="off" autocapitalize="off" spellcheck="false">
                        </div>
                        <div class="field">
                            <label class="field__label" for="setup-password">كلمة المرور (8 أحرف على الأقل)</label>
                            <input class="field__input" type="password" id="setup-password" required autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn btn--primary btn--lg" id="setup-submit">
                            <span class="spinner" aria-hidden="true"></span>
                            <span class="btn__label">إنشاء الحساب</span>
                        </button>
                        <button type="button" class="btn btn--ghost" id="setup-cancel" style="margin-top: var(--space-3);">
                            إلغاء
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        (function () {
            const tabRestaurant   = document.getElementById("tab-restaurant");
            const tabSuperAdmin   = document.getElementById("tab-super-admin");
            const fieldSlug       = document.getElementById("field-restaurant-slug");
            const slugInput       = document.getElementById("restaurant-slug");

            const loginForm       = document.getElementById("login-form");
            const loginSubmit     = document.getElementById("login-submit");
            const alertBox        = document.getElementById("alert-box");

            const usernameInput   = document.getElementById("username");
            const passwordInput   = document.getElementById("password");

            const openSetupBtn    = document.getElementById("open-setup");
            const setupOverlay    = document.getElementById("setup-overlay");
            const setupForm       = document.getElementById("setup-form");
            const setupSubmit     = document.getElementById("setup-submit");
            const setupAlertBox   = document.getElementById("setup-alert-box");
            const setupCancelBtn  = document.getElementById("setup-cancel");

            let mode = "restaurant"; // أو "super-admin"

            // ---------------- تبديل التبويبات ----------------
            function setMode(newMode) {
                mode = newMode;
                const isRestaurant = mode === "restaurant";

                tabRestaurant.classList.toggle("is-active", isRestaurant);
                tabRestaurant.setAttribute("aria-selected", String(isRestaurant));
                tabSuperAdmin.classList.toggle("is-active", !isRestaurant);
                tabSuperAdmin.setAttribute("aria-selected", String(!isRestaurant));

                fieldSlug.style.display = isRestaurant ? "block" : "none";
                slugInput.required = isRestaurant;

                hideAlert(alertBox);
            }

            tabRestaurant.addEventListener("click", () => setMode("restaurant"));
            tabSuperAdmin.addEventListener("click", () => setMode("super-admin"));

            // ---------------- إرسال نموذج الدخول ----------------
            loginForm.addEventListener("submit", async function (e) {
                e.preventDefault();
                hideAlert(alertBox);

                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                const restaurantSlug = mode === "restaurant" ? slugInput.value.trim() : undefined;

                if (!username || !password) {
                    showAlert(alertBox, "الرجاء إدخال اسم المستخدم وكلمة المرور");
                    return;
                }
                if (mode === "restaurant" && !restaurantSlug) {
                    showAlert(alertBox, "الرجاء إدخال معرّف المطعم");
                    return;
                }

                setButtonLoading(loginSubmit, true);

                const result = await apiRequest("/auth/login", {
                    method: "POST",
                    body: { username, password, restaurantSlug },
                });

                setButtonLoading(loginSubmit, false);

                if (!result.ok) {
                    const message = (result.data && result.data.error) || "تعذّر تسجيل الدخول";
                    showAlert(alertBox, message);
                    return;
                }

                // تخزين بيانات عرض بسيطة (اسم المستخدم/الدور) لاستخدامها في
                // رأس الصفحات التالية فقط — ليست بيانات جلسة حساسة، فالجلسة
                // الفعلية محفوظة في Cookie بخاصية HttpOnly ولا تُقرأ من هنا إطلاقًا.
                try {
                    sessionStorage.setItem("cashier_display_username", result.data.user.username);
                    sessionStorage.setItem("cashier_display_role", result.data.user.role);
                } catch (e) { /* يُتجاهل إن كان sessionStorage غير متاح */ }

                redirectByRole(result.data.user.role);
            });

            // ---------------- نافذة الإعداد الأول ----------------
            openSetupBtn.addEventListener("click", () => {
                setupOverlay.style.display = "flex";
            });
            setupCancelBtn.addEventListener("click", () => {
                setupOverlay.style.display = "none";
                hideAlert(setupAlertBox);
            });

            setupForm.addEventListener("submit", async function (e) {
                e.preventDefault();
                hideAlert(setupAlertBox);

                const username = document.getElementById("setup-username").value.trim();
                const password = document.getElementById("setup-password").value;

                if (!username || !password) {
                    showAlert(setupAlertBox, "جميع الحقول مطلوبة");
                    return;
                }
                if (password.length < 8) {
                    showAlert(setupAlertBox, "كلمة المرور يجب ألا تقل عن 8 أحرف");
                    return;
                }

                setButtonLoading(setupSubmit, true);

                const result = await apiRequest("/auth/setup", {
                    method: "POST",
                    body: { username, password },
                });

                setButtonLoading(setupSubmit, false);

                if (!result.ok) {
                    const message = (result.data && result.data.error) || "تعذّر إنشاء الحساب";
                    showAlert(setupAlertBox, message);
                    return;
                }

                showAlert(setupAlertBox, "تم إنشاء الحساب بنجاح، يمكنك تسجيل الدخول الآن", "success");
                setTimeout(() => {
                    setupOverlay.style.display = "none";
                    setMode("super-admin");
                    document.getElementById("username").value = username;
                    document.getElementById("password").focus();
                }, 1200);
            });
        })();
    </script>
</body>
</html>
